<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登記簿OCR - エラー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Meiryo', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            z-index: 1;
            padding-top: 20px;
            background-color: #343a40;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }
        .sidebar .nav-link:hover {
            color: white;
        }
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .sidebar-heading {
            padding: 0.875rem 1.25rem;
            font-size: 1.2rem;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            padding: 50px 0;
        }
        .error-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- サイドバー -->
    <div class="sidebar">
        <div class="text-center">
            <h3 class="sidebar-heading">登記簿OCR</h3>
            <hr class="my-2" style="background-color: rgba(255, 255, 255, 0.3);">
        </div>
        <ul class="nav flex-column px-3">
            <li class="nav-item">
                <a class="nav-link" href="/">
                    <i class="bi bi-speedometer2 me-2"></i> ダッシュボード
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/scan">
                    <i class="bi bi-camera me-2"></i> スキャン・OCR
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/data">
                    <i class="bi bi-database me-2"></i> データ管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/reports">
                    <i class="bi bi-file-earmark-text me-2"></i> レポート
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/chat">
                    <i class="bi bi-chat-dots me-2"></i> チャット
                </a>
            </li>
            <li class="nav-item mt-3">
                <a class="nav-link" href="/settings">
                    <i class="bi bi-gear me-2"></i> 設定
                </a>
            </li>
        </ul>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-body error-container">
                            <div class="error-icon">
                                <i class="bi bi-exclamation-triangle-fill"></i>
                            </div>
                            <div class="error-code">{{ error }}</div>
                            <div class="error-message">{{ message }}</div>
                            <a href="/" class="btn btn-primary">
                                <i class="bi bi-house-door me-2"></i>ホームに戻る
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
